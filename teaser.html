<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yalla.tn</title>
<meta name="description" content="شنوّة يلّا؟ الجواب الليلة، على الثمنية.">
<meta name="theme-color" content="#06030F">
<meta property="og:title" content="يلّا — الليلة، 20:00">
<meta property="og:description" content="برشة منكم سألونا: شنوّة يلّا؟ الجواب الليلة.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%236D4AE0'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23FFC148'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
/* The door before the house. One light, one question, a clock. At 20:00 it opens on its own. */
:root{ --gold:#FFC148; --gold-2:#FFE7A8; --ink:#F4F1FF; --ink-2:rgba(244,241,255,.72); --ink-3:rgba(244,241,255,.46); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#06030F;color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow:hidden}
#sky{position:fixed;inset:0}
.wrap{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px 20px}
.in{display:grid;gap:14px;justify-items:center;max-width:640px}
.mk{width:clamp(72px,14vw,110px);height:clamp(72px,14vw,110px);filter:drop-shadow(0 0 22px rgba(255,193,72,.55));animation:breathe 4.5s ease-in-out infinite}
.mk svg{width:100%;height:100%;display:block}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ask{font-size:clamp(1.05rem,3vw,1.35rem);color:var(--ink-2);font-weight:700}
.q{font-size:clamp(3rem,12vw,6.4rem);line-height:1.15;font-weight:900;color:var(--gold-2);text-shadow:0 0 40px rgba(255,193,72,.7),0 0 90px rgba(255,193,72,.3)}
.ans{font-size:clamp(1.2rem,3.6vw,1.7rem);font-weight:900;margin-top:8px}
.ans b{color:var(--gold)}
.clock{display:flex;gap:clamp(10px,3vw,22px);direction:ltr;margin-top:18px}
.clock div{display:grid;gap:4px;justify-items:center}
.clock b{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(2.4rem,9vw,4.4rem);line-height:1;font-weight:900;color:var(--ink);min-width:2ch;text-shadow:0 0 30px rgba(255,193,72,.25)}
.clock small{font-size:.74rem;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.clock i{font-style:normal;font-family:Inter,sans-serif;font-size:clamp(2rem,7vw,3.6rem);font-weight:900;color:var(--ink-3);align-self:start;line-height:1}
.line{margin-top:22px;font-size:.92rem;color:var(--ink-3);font-weight:700}
.line a{color:var(--gold-2);text-decoration:none;font-family:Inter,sans-serif;font-weight:800;direction:ltr;unicode-bidi:isolate;display:inline-block}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--ink-3);font-weight:700;z-index:1}
@media (prefers-reduced-motion:reduce){ .mk{animation:none} }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap"><div class="in">
  <div class="mk" id="mk"></div>
  <div class="ask">برشة منكم سألونا:</div>
  <div class="q">شنوّة يلّا؟</div>
  <div class="ans">الجواب <b>الليلة</b>، على <b>الثمنية</b>.</div>
  <div class="clock" id="clock"><div><b id="h">--</b><small>ساعة</small></div><i>:</i><div><b id="m">--</b><small>دقيقة</small></div><i>:</i><div><b id="s">--</b><small>ثانية</small></div></div>
  <div class="line">استنّاونا هوني. <a href="https://instagram.com/yalla.3andek" target="_blank" rel="noopener">@yalla.3andek</a></div>
</div></div>
<div class="hint">yalla.tn</div>
<script>
/* the hour the page opens (Tunisia, UTC+1). Change LAUNCH here and in index.html together. */
const LAUNCH = new Date('2026-09-15T19:00:00Z');
document.getElementById('mk').innerHTML = `<svg viewBox="-9 -9 118 118" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="yl" x1="10%" y1="0%" x2="70%" y2="100%"><stop offset="0" stop-color="#B4A0FF"/><stop offset="1" stop-color="#6D4AE0"/></linearGradient><linearGradient id="yr" x1="90%" y1="0%" x2="30%" y2="100%"><stop offset="0" stop-color="#6D4AE0"/><stop offset="1" stop-color="#4A32A8"/></linearGradient><radialGradient id="ys" cx="42%" cy="35%" r="75%"><stop offset="0" stop-color="#FFF8E4"/><stop offset=".55" stop-color="#FFC148"/><stop offset="1" stop-color="#E8A317"/></radialGradient><radialGradient id="yf" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFC148" stop-opacity=".34"/><stop offset=".45" stop-color="#FFA92E" stop-opacity=".12"/><stop offset="1" stop-color="#FF9500" stop-opacity="0"/></radialGradient><radialGradient id="yv" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#A98CFF" stop-opacity=".3"/><stop offset="1" stop-color="#6D4AE0" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="62" fill="url(#yv)"/><path d="M13,57 C11,42 20,27 34,22 C43,19 51,20 58,25 C48,23 38,26 31,34 C24,43 23,54 29,64 C34,72 42,77 51,77 C42,85 26,83 18,73 C15,68 13,63 13,57 Z" fill="url(#yl)"/><path d="M87,49 C89,64 80,79 66,84 C57,87 49,86 42,81 C52,83 62,80 69,72 C76,63 77,52 71,42 C66,34 58,29 49,29 C58,21 74,23 82,33 C85,38 87,43 87,49 Z" fill="url(#yr)"/><circle cx="47" cy="49" r="30" fill="url(#yf)"/><path d="M45.60,35.24 Q46,34 46.40,35.24 L49.37,44.36 L58.96,44.36 Q60.27,44.36 59.21,45.13 L51.45,50.77 L54.41,59.89 Q54.82,61.14 53.76,60.37 L46,54.73 L38.24,60.37 Q37.18,61.14 37.59,59.89 L40.55,50.77 L32.79,45.13 Q31.73,44.36 33.04,44.36 L42.63,44.36 Z" fill="url(#ys)"/><path d="M62.39,57.26 Q62.43,56.69 62.73,57.17 L64.93,60.7 L68.96,59.69 Q69.51,59.56 69.15,59.99 L66.47,63.17 L68.68,66.7 Q68.98,67.18 68.45,66.97 L64.6,65.41 L61.93,68.59 Q61.57,69.03 61.6,68.46 L61.9,64.31 L58.04,62.76 Q57.52,62.55 58.07,62.41 L62.1,61.41 Z" fill="url(#ys)"/></svg>`;
const pad = (n) => String(Math.max(0, n)).padStart(2, '0');
function tick(){ const left = LAUNCH - Date.now(); if (left <= 0){ location.replace('index.html?open=1'); return; }
  const s = Math.floor(left/1000); document.getElementById('h').textContent = pad(Math.floor(s/3600)); document.getElementById('m').textContent = pad(Math.floor(s%3600/60)); document.getElementById('s').textContent = pad(s%60); }
tick(); setInterval(tick, 1000);
/* the sky: stars, a slow violet breath, one light that pulses */
(function(){ const c = document.getElementById('sky'), x = c.getContext('2d'); let W, H, stars = [];
  function build(){ const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W*d; c.height = H*d; x.setTransform(d,0,0,d,0,0); stars = []; for (let i = 0; i < 160; i++) stars.push([Math.random()*W, Math.random()*H, .5 + Math.random()*1.4, Math.random()*6.28]); }
  function draw(now){ const t = now/1000; const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#05020C'); g.addColorStop(1,'#150C38'); x.fillStyle = g; x.fillRect(0,0,W,H);
    x.save(); x.globalCompositeOperation = 'lighter'; const v = x.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.45, Math.max(W,H)*.7); v.addColorStop(0, `rgba(109,74,224,${(.16 + .05*Math.sin(t*.5)).toFixed(3)})`); v.addColorStop(1,'rgba(109,74,224,0)'); x.fillStyle = v; x.fillRect(0,0,W,H);
    for (const s of stars){ const a = .35 + .45*Math.sin(t*1.3 + s[3]); x.fillStyle = `rgba(255,246,224,${a.toFixed(3)})`; x.beginPath(); x.arc(s[0], s[1], s[2], 0, 6.2832); x.fill(); }
    const r = 90 + 25*Math.sin(t*1.1); const l = x.createRadialGradient(W*.5, H*.78, 0, W*.5, H*.78, r*3); l.addColorStop(0,'rgba(255,240,200,.55)'); l.addColorStop(.25,'rgba(255,193,72,.22)'); l.addColorStop(1,'rgba(255,193,72,0)'); x.fillStyle = l; x.beginPath(); x.arc(W*.5, H*.78, r*3, 0, 6.2832); x.fill(); x.restore();
    requestAnimationFrame(draw); }
  build(); addEventListener('resize', build); requestAnimationFrame(draw); })();
</script>
</body>
</html>
