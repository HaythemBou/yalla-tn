/* ═══════════════════════════════════════════════════════════════════════
   يلّا — six chapters, one night.

   The sky behind everything goes from deep night to dawn as you scroll.
   Under the page, a Tunisian skyline: its windows light up one by one
   with your progress. A small star keeps you company and tells you what
   to do. Nothing here has a hard edge; every surface is a patch of light.

     1  مرحبا       your seal, before anything
     2  الحكاية     three scenes, shown
     3  الخريطة     the gathering, your light, the ripple
     4  يلّا معاك    one day with yalla
     5  الطابع      the seal on your photo
     6  الختام      the strand becomes the map; the wave
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --violet:#6D4AE0; --violet-l:#A98CFF; --gold:#FFC148; --gold-2:#FFE7A8;
  --coral:#FF7A5C; --teal:#3FD2C0;
  --ink:#F4F1FF; --ink-2:rgba(244,241,255,.74); --ink-3:rgba(244,241,255,.46);
  --bg:#06030F; --line:rgba(255,255,255,.1); --card:rgba(255,255,255,.045);
  --wrap:1080px; --rail:96px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;font-family:Cairo,"Noto Sans Arabic",system-ui,sans-serif}
html[lang="fr"] body,html[lang="en"] body{font-family:Inter,system-ui,sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:10px}
::selection{background:var(--gold);color:#160D30}
button,input,textarea,select{font-family:inherit}

/* the night, the town, the strand, the star */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#town{position:fixed;left:0;right:0;bottom:0;height:26vh;height:26dvh;z-index:0;pointer-events:none;display:block}
.page{position:relative;z-index:1;padding-right:var(--rail);text-shadow:0 1px 12px rgba(6,3,15,.9),0 0 32px rgba(6,3,15,.8)}
#dna{position:fixed;top:0;right:0;width:var(--rail);height:100vh;height:100dvh;display:block;z-index:2}
@media (max-width:760px){ :root{--rail:0px} #dna{display:none} }



.guide{position:fixed;top:62px;left:0;right:0;z-index:58;display:flex;justify-content:center;padding:0 12px;padding-right:calc(var(--rail) + 12px);pointer-events:none}
.guide[hidden]{display:none}
.guide .in{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:640px;width:100%;padding:8px 14px 8px 10px;border-radius:22px;background:rgba(14,7,34,.9);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,231,168,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;text-shadow:none}
.guide .mk{width:46px;height:46px;flex:0 0 auto;display:block;filter:drop-shadow(0 0 10px rgba(255,193,72,.5))}
.guide .mk svg{width:100%;height:100%;display:block}
.guide .gt{flex:1;min-width:0;font-size:.95rem;font-weight:700;line-height:1.45}
.guide .gt.pulse{animation:pop .4s both}
.guide .gchip{flex:0 0 auto;font-size:.82rem;font-weight:900;cursor:pointer;padding:9px 14px;border-radius:999px;border:none;background:rgba(255,193,72,.14);color:var(--gold-2)}
.guide .gchip:hover{background:var(--gold);color:#160D30}
@media (max-width:760px){ .guide{top:58px;padding:0 8px} .guide .in{gap:9px;padding:7px 10px 7px 8px} .guide .mk{width:38px;height:38px} .guide .gt{font-size:.86rem} }
.startrow{margin-top:30px;display:grid;gap:10px;justify-items:center}
.startrow .btn{font-size:1.15rem;padding:19px 46px}
.startrow .free{font-size:.86rem;color:var(--ink-3);font-weight:700}
body.walk .startrow{display:none}
.wrap{width:min(var(--wrap),calc(100% - 40px));margin-inline:auto}
section{position:relative;padding:clamp(80px,10vw,140px) 0}
h1,h2{line-height:1.08;letter-spacing:-.03em;font-weight:900;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .bub,html[lang="ar"] .scene-t{letter-spacing:0;line-height:1.3}
h1{font-size:clamp(3rem,10vw,6.8rem)}
h2{font-size:clamp(2rem,5.4vw,3.6rem)}
.lead{font-size:clamp(1.03rem,2vw,1.24rem);color:var(--ink-2);font-weight:400;line-height:1.66}
.num{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate;display:inline-block}
.g{color:var(--gold)}
.head{max-width:760px}
.head .lead{margin-top:16px}
/* a patch of light instead of a box */
.glowbox{position:relative;border-radius:28px;padding:22px 24px;background:radial-gradient(120% 140% at 50% 0%,rgba(255,193,72,.1),rgba(255,255,255,.03) 60%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.glowbox.teal{background:radial-gradient(120% 140% at 50% 0%,rgba(63,210,192,.12),rgba(255,255,255,.03) 60%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:1rem;font-weight:900;cursor:pointer;
  padding:16px 30px;border-radius:999px;border:1.5px solid transparent;text-decoration:none;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,#FFD780,var(--gold));color:#160D30;box-shadow:0 10px 34px rgba(255,193,72,.26),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{box-shadow:0 16px 46px rgba(255,193,72,.44),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-out{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btn-out:hover{background:rgba(255,255,255,.11)}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn-sm{padding:11px 19px;font-size:.87rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.next{display:flex;justify-content:center;margin-top:clamp(40px,6vw,64px)}
.next a{display:inline-flex;align-items:center;gap:14px;text-decoration:none;font-weight:900;font-size:1.05rem;color:var(--gold-2);
  padding:14px 22px;border-radius:999px;background:radial-gradient(100% 200% at 50% 0%,rgba(255,193,72,.16),rgba(255,193,72,.04));transition:.2s}
.next a:hover{background:rgba(255,193,72,.16);transform:translateY(-2px)}
.next a i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#160D30;display:grid;place-items:center;flex:0 0 auto;animation:nudge 1.8s ease-in-out infinite}
.next a i svg{width:15px;height:15px}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ── header: brand · the thread · languages ── */
header{position:fixed;inset:0 0 auto 0;z-index:60;padding:10px 0;padding-right:var(--rail);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(180deg,rgba(6,3,15,.72),rgba(6,3,15,.35));transition:background .3s}
header.stuck{background:linear-gradient(180deg,rgba(6,3,15,.9),rgba(6,3,15,.7))}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mk{width:40px;height:40px;flex:0 0 auto;display:block;animation:markGlow 4.2s ease-in-out infinite}
.brand .mk svg{width:100%;height:100%;display:block}
@keyframes markGlow{0%,100%{filter:drop-shadow(0 0 9px rgba(255,193,72,.38))}50%{filter:drop-shadow(0 0 18px rgba(255,193,72,.7))}}
.brand b{font-size:1.3rem;font-weight:900;font-family:Cairo,sans-serif;color:var(--ink)}
.thread{position:relative;display:flex;align-items:center;gap:0;height:40px;padding:0 6px}
.thread::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:1px;background:rgba(255,255,255,.14)}
.thread .lit{position:absolute;inset-inline-start:18px;top:50%;height:1px;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));box-shadow:0 0 8px var(--gold);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bead{position:relative;width:36px;height:40px;border:none;background:none;cursor:pointer;display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.bead i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);transition:.3s;display:block}
.bead.on i{background:var(--gold-2);box-shadow:0 0 10px var(--gold)}
.bead.cur i{width:13px;height:13px;background:#FFF6DC;box-shadow:0 0 0 4px rgba(255,193,72,.25),0 0 18px var(--gold);animation:beadPulse 2s ease-in-out infinite}
@keyframes beadPulse{0%,100%{box-shadow:0 0 0 4px rgba(255,193,72,.25),0 0 18px var(--gold)}50%{box-shadow:0 0 0 7px rgba(255,193,72,.12),0 0 26px var(--gold)}}
.bead span{display:none}
@media (max-width:560px){ .thread{padding:0} .bead{width:26px} .bead span{display:none} .thread::before,.thread .lit{left:13px;right:13px} .thread .lit{inset-inline-start:13px} }
.langs{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:6px;font-family:Inter,sans-serif;font-size:.74rem;font-weight:900;letter-spacing:.06em;cursor:pointer;border:1.5px solid rgba(255,193,72,.45);background:rgba(255,255,255,.05);color:var(--gold-2);padding:7px 10px 7px 8px;border-radius:999px;transition:.16s}
.langbtn:hover,.langbtn[aria-expanded="true"]{background:rgba(255,193,72,.14)}
.langbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.langbtn .car{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;margin-inline-start:2px}
.langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:170px;display:grid;gap:2px;padding:6px;border-radius:16px;background:rgba(14,7,34,.97);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,193,72,.3);z-index:70;animation:bubIn .22s both}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;cursor:pointer;border:none;background:none;color:var(--ink-2);padding:10px 12px;border-radius:11px;font-size:.92rem;font-weight:700;transition:.14s}
.langmenu button b{font-family:Inter,sans-serif;font-size:.7rem;font-weight:900;letter-spacing:.06em;color:var(--ink-3);min-width:22px}
.langmenu button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.langmenu button[aria-pressed="true"]{background:rgba(255,193,72,.16);color:var(--gold-2)}
.langmenu button[aria-pressed="true"] b{color:var(--gold)}

/* ── 1 · welcome ── */
#hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding-top:110px}
#hero h1{text-shadow:none;font-size:clamp(3.2rem,11vw,7.4rem);background:linear-gradient(110deg,var(--gold-2),var(--gold) 46%,#FF9E4D);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:.12em}
#hero .h2{margin-top:10px;font-size:clamp(1.25rem,3.4vw,2rem);font-weight:900;line-height:1.35;max-width:30ch;text-wrap:balance;margin-inline:auto}
#hero .h2 span{display:block;color:var(--ink-2);font-weight:700}
.pad{margin:44px auto 0;display:grid;justify-items:center;gap:14px}
.padlabel{font-size:1.06rem;font-weight:900}
.padhint{font-size:.88rem;color:var(--ink-3);max-width:36ch}
.press{position:relative;width:230px;height:230px;border-radius:50%;cursor:pointer;border:none;background:none;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.press canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.press .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,193,72,.3);transition:border-color .2s,box-shadow .2s}
.press:hover .ring{border-color:rgba(255,193,72,.6)}
.press.holding .ring{border-color:var(--gold);box-shadow:0 0 44px rgba(255,193,72,.4)}
.press .arc{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));opacity:.9}
.press.done{cursor:default}
.press .fp{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,231,168,.7);font-weight:900;font-size:.95rem;transition:opacity .3s;pointer-events:none}
.press.holding .fp,.press.done .fp{opacity:0}
@keyframes settle{0%{box-shadow:0 0 0 0 rgba(255,193,72,.6)}100%{box-shadow:0 0 0 56px rgba(255,193,72,0)}}
.press.done .ring{animation:settle 1.2s ease-out 1;border-color:var(--gold)}
.made{display:none;text-align:center}
.made.on{display:block;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.made .hi{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;color:var(--gold)}
.made .lit{margin-top:6px;color:var(--ink-2);max-width:44ch;margin-inline:auto}
.made .lit b{color:var(--ink);font-weight:900}
.made .tier{color:var(--gold);font-weight:900} .made .tier[hidden]{display:none}
.made .seal-no{font-size:1.25em;color:var(--gold);text-shadow:0 0 24px rgba(255,193,72,.5)}
.made .wait{font-size:.82rem;color:var(--ink-3)}
.made .seal-code{font-size:.95em;letter-spacing:.08em;color:var(--gold-2);background:rgba(255,193,72,.12);padding:2px 10px;border-radius:999px}
.made .theme{font-weight:700} .made .theme b{color:var(--gold-2);font-weight:900}
.namebox{margin:26px auto 0;max-width:480px;display:none}
.namebox.on{display:block;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) .15s both}
.namelabel{font-size:.98rem;font-weight:900;color:var(--ink-2);margin-bottom:12px}
.nameform{display:flex;gap:10px;align-items:stretch}
@media (max-width:460px){ .nameform{flex-direction:column} }
.nameform input{flex:1;min-width:0;font-size:1.05rem;font-weight:700;color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid transparent;border-radius:999px;padding:17px 26px;text-align:center;transition:border-color .2s,box-shadow .2s}
.nameform input::placeholder{color:rgba(244,241,255,.3);font-weight:400}
.nameform input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,193,72,.14)}
.nameform .btn{min-width:118px}
.namehint{margin-top:12px;font-size:.8rem;color:var(--ink-3)}
.greet{display:none;margin-top:22px}
.greet.on{display:block;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.greet .hi{font-size:clamp(1.3rem,3.6vw,2rem);font-weight:900}
.greet .hi em{font-style:normal;color:var(--gold);text-shadow:0 0 40px rgba(255,193,72,.5)}
.greet .lit{margin-top:4px;color:var(--ink-2)}
@keyframes heroIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
#hero h1{animation:heroIn .8s cubic-bezier(.2,.8,.2,1) .1s both}
#hero .h2{animation:heroIn .8s cubic-bezier(.2,.8,.2,1) .26s both}
#hero .pad{animation:heroIn .8s cubic-bezier(.2,.8,.2,1) .42s both}

/* ── 2 · the story: sticky film ── */
/* ── 2 · the story: a reel. Plays on its own, tap to skip, swipe on a phone. ── */
#story{padding-top:clamp(40px,6vw,70px)}
.reel{max-width:760px;margin:0 auto;text-align:center;display:grid;gap:14px;justify-items:center}
.bars{display:flex;gap:6px;width:min(640px,92vw)}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;display:block}
.bars i b{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 10px rgba(255,193,72,.6)}
.stage{position:relative;width:min(640px,92vw);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:pan-y;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#sceneCanvas{width:100%;height:auto;aspect-ratio:1;display:block;transition:opacity .35s}
.stage.switching #sceneCanvas{opacity:.3}
.stage .tapzone{position:absolute;top:0;bottom:0;width:30%;opacity:0;border:none;background:none;cursor:pointer}
.stage .tapzone.prev{inset-inline-start:0} .stage .tapzone.nextz{inset-inline-end:0}
.stage .hint{position:absolute;top:12px;inset-inline-end:14px;font-size:.72rem;font-weight:900;color:rgba(255,231,168,.8);background:rgba(6,3,15,.6);padding:5px 10px;border-radius:999px;pointer-events:none;opacity:0;transition:.3s;text-shadow:none}
.stage .hint.on{opacity:1;animation:beadPulse 2s infinite;font-size:.86rem;padding:8px 14px;top:14px;inset-inline-start:50%;transform:translateX(-50%);inset-inline-end:auto;white-space:nowrap}
html[dir="rtl"] .stage .hint.on{transform:translateX(50%)}
.stage.acted .hint{opacity:0}
.btn[aria-disabled="true"]{opacity:.55}
.scene-text{position:absolute;inset-inline:0;bottom:0;display:grid;gap:4px;padding:90px 18px 18px;background:linear-gradient(180deg,rgba(6,3,15,0),rgba(6,3,15,.88) 40%,rgba(6,3,15,.96));pointer-events:none;text-align:center}
.scene-t{font-size:clamp(1.35rem,4.6vw,2.2rem);font-weight:900;color:var(--ink);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.scene-b{font-size:clamp(.88rem,2.4vw,1.05rem);font-weight:700;color:var(--ink-2);opacity:0;transform:translateY(14px);transition:opacity .6s .12s,transform .6s .12s;text-wrap:balance}
.scene-c{font-size:clamp(1rem,3vw,1.35rem);font-weight:900;color:var(--gold);opacity:0;transform:translateY(14px);transition:opacity .6s .24s,transform .6s .24s;text-shadow:0 0 40px rgba(255,193,72,.35)}
.reel.on .scene-t{opacity:1;transform:none}
.reel.on.told .scene-b,.reel.on.told .scene-c{opacity:1;transform:none}
.reelbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reelbtns .btn svg{transform:scaleX(-1)} html[dir="ltr"] .reelbtns .btn svg{transform:none}
#story .next{margin-top:0;padding:clamp(40px,6vw,64px) 20px}

/* ── 3 · the map ── */
.light-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,5vw,58px);align-items:center}
@media (max-width:920px){ .light-grid{grid-template-columns:1fr} }
.mapbox{position:relative;aspect-ratio:3/4;max-width:520px;margin-inline:auto;width:100%}
#mapCanvas{width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation;
  -webkit-mask:radial-gradient(ellipse 64% 62% at 50% 50%,#000 56%,transparent 100%);mask:radial-gradient(ellipse 64% 62% at 50% 50%,#000 56%,transparent 100%)}
#mapTip{position:absolute;pointer-events:none;transform:translate(-50%,-150%);background:rgba(6,3,15,.95);border-radius:999px;padding:7px 14px;font-size:.78rem;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .16s;z-index:3;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
#mapTip.on{opacity:1}
.narr{min-height:64px;margin-top:6px;text-align:center;display:grid;place-items:center}
.narr b{font-size:clamp(1.3rem,3.6vw,2.2rem);font-weight:900;color:var(--gold-2);text-shadow:0 0 30px rgba(255,193,72,.5);opacity:0;transform:translateY(8px);transition:.35s;display:block}
.narr b.on{opacity:1;transform:none}
.narr small{display:block;font-size:.86rem;color:var(--ink-3);font-weight:700;margin-top:4px}
/* the gathering: a number inside a ring of lights */
.gather{display:flex;align-items:center;gap:18px;margin-top:22px}
.ringbox{position:relative;width:150px;height:150px;flex:0 0 auto}
.ringbox canvas{width:100%;height:100%;display:block}
.counter{text-shadow:none;position:absolute;inset:0;display:grid;place-items:center;font-family:Inter,sans-serif;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;font-size:2.6rem;line-height:1;
  background:linear-gradient(110deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,193,72,.35))}
.gather .t{display:grid;gap:4px}
.gather .t b{font-size:1.05rem;font-weight:900}
.gather .t small{font-size:.86rem;color:var(--ink-3);font-weight:700;min-height:1.2em;display:flex;align-items:center;gap:8px}
.gather .t small i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:beadPulse 1.6s infinite;display:inline-block}
.plus{position:absolute;top:8px;right:6px;font-family:Inter,sans-serif;font-weight:900;font-size:.9rem;color:var(--teal);opacity:0;transform:translateY(0)}
.plus.go{animation:plusUp 1.6s ease-out both}
@keyframes plusUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
/* the picker: one field, suggestions as lights */
.picker{margin-top:26px;position:relative;scroll-margin-top:140px}
.picker .lbl{font-weight:900;font-size:1.05rem}
.picker .hint{font-size:.86rem;color:var(--ink-3);margin-top:2px}
.pickfield{position:relative;margin-top:12px}
.pickfield input{width:100%;font-size:1.05rem;font-weight:700;color:var(--ink);background:rgba(255,255,255,.07);border:1.5px solid transparent;border-radius:999px;padding:16px 52px 16px 22px;transition:border-color .2s,box-shadow .2s}
html[dir="ltr"] .pickfield input{padding:16px 22px 16px 52px}
.pickfield input::placeholder{color:rgba(244,241,255,.32);font-weight:400}
.pickfield input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,193,72,.14)}
.pickfield svg{position:absolute;top:50%;inset-inline-start:20px;transform:translateY(-50%);width:20px;height:20px;color:var(--gold);pointer-events:none}
.sugg{position:absolute;inset-inline:0;top:calc(100% + 8px);z-index:8;display:grid;gap:2px;padding:6px;border-radius:20px;background:rgba(14,7,34,.97);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1)}
.sugg[hidden]{display:none}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;font-size:.95rem;font-weight:700;color:var(--ink);background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:14px}
.sugg button:hover,.sugg button.hot{background:rgba(255,193,72,.14)}
.sugg button small{color:var(--ink-3);font-weight:700;font-size:.78rem;white-space:nowrap}
.sugg .none{padding:11px 14px;color:var(--ink-3);font-size:.9rem}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.quick .q{font-size:.8rem;color:var(--ink-3);font-weight:700;margin-inline-end:4px}
.quick button{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:900;cursor:pointer;padding:9px 14px;border-radius:999px;border:none;background:rgba(255,255,255,.06);color:var(--ink-2);transition:.16s}
.quick button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.quick button:hover{background:rgba(255,193,72,.14);color:var(--ink)}
.chosen{display:none;align-items:center;gap:12px;margin-top:14px;font-weight:700;flex-wrap:wrap}
.chosen.on{display:flex;animation:pop .4s both}
.chosen b{color:var(--gold-2);font-size:1.1rem}
.chosen button{font-size:.8rem;font-weight:900;cursor:pointer;background:none;border:none;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
@media (max-width:920px){ .light-grid > .mapcol{display:contents} .mapintro{order:-2} .light-grid > .mapside{order:-1} .mapctl{order:1} }

/* ── 4 · one day with yalla ── */
.daygrid{display:grid;grid-template-columns:380px 1fr;gap:clamp(28px,5vw,60px);align-items:start;margin-top:clamp(28px,4vw,46px)}
@media (max-width:900px){ .daygrid{grid-template-columns:1fr;justify-items:center} }
.phone{width:360px;max-width:100%;aspect-ratio:9/18.4;border-radius:42px;padding:9px;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.05));box-shadow:0 34px 80px rgba(0,0,0,.62)}
.phone .scr{width:100%;height:100%;border-radius:34px;overflow:hidden;position:relative;background:linear-gradient(180deg,#0E0726,#08041A);display:flex;flex-direction:column}
.phone .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:86px;height:11px;border-radius:999px;background:rgba(0,0,0,.6);z-index:6}
.dayhead{padding:36px 16px 10px;display:flex;align-items:center;gap:11px;flex:0 0 auto;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.dayhead .mk{width:42px;height:42px;flex:0 0 auto;display:block;filter:drop-shadow(0 0 10px rgba(255,193,72,.55))}
.dayhead .mk svg{width:100%;height:100%;display:block}
.yl{white-space:nowrap;font-family:Cairo,sans-serif;font-weight:900;color:var(--gold-2);text-shadow:0 0 12px rgba(255,193,72,.9),0 0 28px rgba(255,193,72,.5);letter-spacing:.02em}
.bub .yl{font-size:1.05em}
.dayhead b{font-size:.98rem;font-weight:900;display:block}
.dayhead small{display:block;font-size:.68rem;color:var(--teal);font-weight:700;min-height:1em}
.dayhead .fx{margin-inline-start:auto;display:flex;gap:12px;text-align:center;font-size:.6rem;color:var(--ink-3);font-weight:900;line-height:1.1}
.dayhead .fx i{font-style:normal;font-family:Inter,sans-serif}
.dayhead .fx b{font-family:Inter,sans-serif;font-size:1.25rem;color:var(--gold);display:block}
.chatlog{flex:1;overflow:auto;padding:12px 14px 20px;display:grid;gap:9px;align-content:start;scroll-behavior:smooth;overscroll-behavior:contain}
.bub{max-width:86%;padding:11px 15px;border-radius:20px;font-size:.9rem;font-weight:700;line-height:1.5;animation:bubIn .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.bub.b{justify-self:start;background:rgba(255,255,255,.09);border-end-start-radius:6px}
.bub.u{justify-self:end;background:linear-gradient(135deg,rgba(255,193,72,.28),rgba(255,193,72,.16));color:var(--gold-2);border-end-end-radius:6px}
.bub.p::before,.bub.x::before,.bub.r::before{content:attr(data-cap);display:block;font-size:.62rem;font-weight:900;letter-spacing:.04em;opacity:.8;margin-bottom:3px}
.bub.p::before{color:var(--coral)} .bub.x::before{color:var(--gold)} .bub.r::before{color:var(--teal)}
.bub.p{justify-self:stretch;max-width:100%;background:rgba(255,122,92,.1);color:var(--ink-2);font-weight:600;font-size:.86rem;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,122,92,.22)}
.bub.x{justify-self:stretch;max-width:100%;background:radial-gradient(120% 200% at 0% 0%,rgba(255,193,72,.2),rgba(255,193,72,.06));color:var(--gold-2);font-size:.84rem;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,193,72,.25)}
.notif .ft{display:inline-block;font-size:.66rem;font-weight:900;color:var(--gold);background:rgba(255,193,72,.14);padding:1px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.bub.r{justify-self:start;background:radial-gradient(100% 200% at 0% 0%,rgba(63,210,192,.18),rgba(63,210,192,.06));color:#CFF7F1;border-end-start-radius:6px}
.bub.q{font-weight:900;color:var(--gold-2)}
.bub.no,.bub.x,.bub.take{white-space:pre-line}
.bub.no{justify-self:stretch;max-width:100%;background:rgba(255,255,255,.05);color:var(--ink-3);font-weight:600;font-size:.84rem;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.bub.no::before,.bub.take::before{content:attr(data-cap);display:block;font-size:.62rem;font-weight:900;letter-spacing:.04em;opacity:.8;margin-bottom:3px}
.bub.no::before{color:var(--ink-3)}
.bub.take{justify-self:stretch;max-width:100%;background:rgba(255,193,72,.08);border-inline-start:3px solid var(--gold);color:var(--ink);font-weight:700;font-size:.86rem;border-radius:6px 16px 16px 6px}
.bub.take::before{color:var(--gold)}
.chip.next{border-color:var(--gold);background:var(--gold);color:#160D30}
/* the guide lives at the bottom: the top is where in-app browsers put their own bars */
.guide{top:auto;bottom:max(14px,env(safe-area-inset-bottom))}
.guide .in{box-shadow:0 -14px 40px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,193,72,.35)}
.guide .gl{flex:0 0 auto;font-size:.66rem;font-weight:900;letter-spacing:.06em;color:var(--gold);background:rgba(255,193,72,.14);padding:3px 8px;border-radius:999px}
/* where to press: a halo that breathes, and an arrow that points down at it */
.press::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,193,72,.7);animation:padHalo 1.6s ease-out infinite;pointer-events:none}
.padlabel::after{content:"";display:block;margin:8px auto 0;width:14px;height:14px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg);animation:padArrow 1.2s ease-in-out infinite}
body.sealed .press::before,body.sealed .padlabel::after{display:none}
@keyframes padHalo{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
@keyframes padArrow{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(4px,4px)}}
/* the story: a marker where to tap, instead of a sentence at the top */
.stage .hint{display:none}
.stage .tapmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:grid;justify-items:center;gap:6px;transition:opacity .3s,left .4s,top .4s}
.stage .tapmark i{width:34px;height:34px;border-radius:50%;border:3px solid var(--gold-2);box-shadow:0 0 18px var(--gold);position:relative}
.stage .tapmark i::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,231,168,.8);animation:padHalo 1.4s ease-out infinite}
.stage .tapmark b{font-size:.82rem;font-weight:900;color:var(--gold-2);background:rgba(6,3,15,.7);padding:5px 12px;border-radius:999px;white-space:nowrap}
.stage.acted .tapmark{opacity:0}
.stage .tapmark{z-index:5}
body.walk{padding-bottom:96px}
/* the chat: answers side by side, the last one alone across */
.chiprow{grid-template-columns:1fr 1fr}
.chip{padding:11px 10px;font-size:.84rem;line-height:1.3}
.chiprow .chip:last-child:nth-child(odd){grid-column:1/-1}
.dayskip{margin:12px auto 0;display:flex}
/* the post: the photo can be moved; the slider; the options */
.cardframe.grab{cursor:grab;touch-action:none}
.photoctl{margin-top:10px;display:grid;gap:6px}
.photoctl label{display:grid;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.photoctl input[type=range]{width:100%;accent-color:var(--gold)}
/* the phone grows with the conversation; the page scrolls, its head stays pinned */
.phone{aspect-ratio:auto;height:auto;min-height:420px}
.phone .scr{height:auto;overflow:visible}
.dayhead{position:sticky;top:60px;z-index:6;background:#0E0726;border-radius:34px 34px 0 0;box-shadow:0 8px 20px rgba(8,4,26,.6)}
.chatlog{flex:none;overflow:visible;scroll-behavior:auto;overscroll-behavior:auto}
.newmsg{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:57;font-size:.86rem;font-weight:900;cursor:pointer;padding:10px 16px;border-radius:999px;border:none;background:var(--gold);color:#160D30;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:bubIn .3s both}
.newmsg::after{content:"";display:inline-block;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin-inline-start:8px;vertical-align:2px}
.newmsg[hidden]{display:none}
body.walk .newmsg{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 78px)}
.delegs{margin-top:10px} .delegs button[aria-pressed="true"]{background:var(--gold);color:#160D30} .delegs button[aria-pressed="true"]::before{background:#160D30;box-shadow:none}
#nameInput.shake{animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bub.typing{color:var(--ink-3);font-size:.8rem;padding:9px 14px}
.bub.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-inline:2px;animation:dot 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
.notif{justify-self:stretch;display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:18px;padding:11px 12px;animation:notifIn .5s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
@keyframes notifIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
.notif .ic{width:34px;height:34px;border-radius:11px;background:rgba(255,193,72,.16);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}
.notif.warn .ic{background:rgba(255,122,92,.16);color:var(--coral)}
.notif .ic svg{width:18px;height:18px}
.notif .tx{min-width:0;flex:1}
.notif .tx .at{font-family:Inter,sans-serif;font-size:.66rem;font-weight:900;color:var(--ink-3);letter-spacing:.04em;direction:ltr;display:inline-block}
.notif .tx .t{font-size:.86rem;font-weight:900;line-height:1.35;margin-top:2px}
.notif .tx .s{font-size:.76rem;color:var(--ink-3);font-weight:700;margin-top:2px}
.chiprow{justify-self:stretch;display:grid;gap:8px;padding:4px 0 8px}
.chip{font-size:.9rem;font-weight:900;cursor:pointer;padding:13px 16px;border-radius:16px;width:100%;text-align:center;border:1.5px solid rgba(255,193,72,.5);background:rgba(255,193,72,.08);color:var(--gold-2);transition:.15s;animation:bubIn .3s both}
.chip:hover{background:var(--gold);color:#160D30;transform:translateY(-1px)}
.chip.next{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--ink-2)}
.values{display:grid;gap:14px;margin-top:6px;grid-template-columns:1fr 1fr}
@media (max-width:1100px){ .values{grid-template-columns:1fr} }
.values,.vcard{min-width:0;max-width:100%}
.vcard{background:rgba(255,255,255,.04);border-radius:22px;padding:12px 14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.vcard .demo{width:100%;height:auto;aspect-ratio:2;display:block;border-radius:14px;margin-bottom:10px}
.notif + .demo,.chatlog .demo{justify-self:stretch;width:100%;max-width:100%;min-width:0;height:auto;aspect-ratio:2;border-radius:16px;display:block;animation:bubIn .5s both}
.values .vcard{display:block}
.values .vi{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;color:var(--gold);background:radial-gradient(100% 100% at 30% 20%,rgba(255,193,72,.28),rgba(255,193,72,.06))}
.values .vi svg{width:22px;height:22px}
.values b{font-size:1.05rem;font-weight:900;display:block}
.values p{color:var(--ink-2);font-size:.95rem;margin-top:2px}
@media (max-width:900px){ .values{max-width:560px;width:100%} }

/* ── 5 · the seal on the photo ── */
.resultgrid{display:grid;grid-template-columns:330px 1fr;gap:clamp(28px,5vw,60px);align-items:start;margin-top:clamp(28px,4vw,44px)}
@media (max-width:860px){ .resultgrid{grid-template-columns:1fr;justify-items:center;text-align:center} }
.cardframe{scroll-margin-top:140px;width:310px;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.09)}
#storyCanvas{width:100%;height:auto;display:block}
.custom{display:grid;gap:18px}
.custom .lbl{font-size:.82rem;font-weight:900;color:var(--ink-3);margin-bottom:8px;letter-spacing:.04em}
.modes{display:inline-flex;gap:3px;background:rgba(255,255,255,.05);border-radius:999px;padding:3px}
.modes button{font-size:.8rem;font-weight:900;cursor:pointer;border:none;background:none;color:var(--ink-3);padding:9px 16px;border-radius:999px;transition:.16s}
.modes button[aria-pressed="true"]{background:var(--gold);color:#160D30}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c);transition:transform .15s;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.swatches button:hover{transform:scale(1.1)}
.swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 18px var(--c)}
.swatches button.secret{animation:pop .5s both;box-shadow:0 0 14px #fff}
@media (max-width:860px){ .swatches,.modes,.photorow,.cardlangs,.share-row{justify-content:center} }
.photorow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.cardlangs{display:flex;gap:8px;flex-wrap:wrap}
.cardlangs button{font-size:.82rem;font-weight:900;cursor:pointer;padding:9px 17px;border-radius:999px;border:none;background:rgba(255,255,255,.06);color:var(--ink-2);transition:.16s}
.cardlangs button[aria-pressed="true"]{background:var(--gold);color:#160D30}
.share-row{display:flex;flex-wrap:wrap;gap:10px}
.ask{margin-top:6px;display:grid;gap:8px}
.ask div{display:flex;gap:12px;align-items:baseline;font-weight:700;font-size:.98rem}
.ask b{font-family:Inter,sans-serif;font-weight:900;color:var(--gold);direction:ltr;flex:0 0 auto}
.ask a{color:var(--gold);text-decoration:none;font-weight:900}
.formnote{font-size:.82rem;color:var(--ink-3);margin-top:8px}

/* ── 6 · the end: what you did ── */
#end{overflow:hidden}
.endgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);align-items:start;margin-top:clamp(28px,4vw,44px)}
@media (max-width:860px){ .endgrid{grid-template-columns:1fr} }
.receipt{padding:22px 26px;text-align:start;position:relative}
.receipt ul{list-style:none;display:grid;gap:11px}
.receipt li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1rem;color:var(--ink-3)}
.receipt li::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2);flex:0 0 auto;display:grid;place-items:center}
.receipt li.done{color:var(--ink)}
.receipt li.done::before{content:"✓";border-color:var(--teal);background:var(--teal);color:#06030F;font-size:.8rem;font-weight:900;line-height:1}
.receipt .stamp{position:absolute;top:-14px;inset-inline-end:22px;transform:rotate(8deg);font-weight:900;font-size:.9rem;letter-spacing:.06em;color:var(--gold);border:2.5px solid var(--gold);border-radius:8px;padding:4px 12px;background:var(--bg);opacity:0;transition:.4s}
.receipt .stamp.on{opacity:1;animation:stampIn .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes stampIn{from{transform:rotate(8deg) scale(1.8);opacity:0}to{transform:rotate(8deg) scale(1);opacity:1}}
.supporter{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-weight:900;font-size:1.05rem}
.supporter[hidden]{display:none}
.supporter .num{font-size:1.5rem;color:var(--gold);margin-inline:6px;text-shadow:0 0 24px rgba(255,193,72,.5)}
.supporter small{display:block;font-size:.84rem;color:var(--ink-3);font-weight:700;margin-top:2px}
.team h3,.findme h3{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:900}
.team p,.findme p{color:var(--ink-2);margin-top:6px;font-size:.96rem}
.team form{display:grid;gap:10px;margin-top:14px}
.team textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid transparent;border-radius:20px;padding:14px 18px;resize:vertical;min-height:88px;line-height:1.5}
.team textarea:focus{outline:none;border-color:var(--teal)}
.team .row{display:flex;gap:10px;flex-wrap:wrap}
.team .row input{flex:1;min-width:180px;font-size:.95rem;color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid transparent;border-radius:999px;padding:13px 18px}
.team .row input:focus{outline:none;border-color:var(--teal)}
.team ::placeholder,.findme ::placeholder{color:rgba(244,241,255,.3)}
.findme{margin-top:26px}
.findme form{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.findme input{flex:1;min-width:200px;font-size:1rem;color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid transparent;border-radius:999px;padding:16px 22px}
.findme input:focus{outline:none;border-color:var(--gold)}
.okmsg{display:none;margin-top:14px;background:rgba(63,210,192,.13);border-radius:22px;padding:15px 20px;color:var(--teal);font-weight:900}
.okmsg.on{display:block}

/* ── the finale: the mark, the word, and the town behind ── */
#finale{min-height:100svh;display:grid;place-items:center;text-align:center;padding:clamp(80px,12vw,160px) 0 34vh}
#finale .mk{display:inline-block;width:clamp(120px,22vw,200px);height:clamp(120px,22vw,200px);animation:markGlow 4.2s ease-in-out infinite}
#finale .mk svg{width:100%;height:100%;display:block}
#finale .word{text-shadow:none;font-family:Cairo,sans-serif;font-weight:900;font-size:clamp(4rem,14vw,9rem);line-height:1;margin-top:6px;background:linear-gradient(110deg,var(--gold-2),var(--gold) 46%,#FF9E4D);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.1em}
#finale h2{font-size:clamp(1.6rem,4.4vw,2.6rem);margin-top:4px}
#finale .lead{margin-top:6px}
#finale .tag{margin-top:18px;color:var(--ink-2);font-weight:700;max-width:40ch;margin-inline:auto}
.plat{display:flex;justify-content:center;gap:34px;margin:26px 0 24px;flex-wrap:wrap}
.plat div{display:grid;justify-items:center;gap:7px;color:var(--gold);font-weight:900;font-size:.84rem}
.plat svg{width:28px;height:28px}
.social{display:flex;justify-content:center;gap:11px;margin-top:14px}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--ink-2);transition:.2s;text-decoration:none}
.social a:hover{background:rgba(255,193,72,.16);color:var(--gold)}
.social svg{width:20px;height:20px}
.copy{margin-top:20px;color:var(--ink-3);font-size:.82rem}
.credits{margin-top:10px;font-size:.72rem;color:var(--ink-3)}

opacity:0;transform:translateY(24px);transition:opacity .75s cubic-bezier(.2,.8,.2,1),transform .75s cubic-bezier(.2,.8,.2,1)}
.js-rv .rv.in{opacity:1;transform:none}
.js-rv .rv-1{transition-delay:.07s}.js-rv .rv-2{transition-delay:.14s}.js-rv .rv-3{transition-delay:.21s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.findme input.sr{width:1px;min-width:0;padding:0;border:0}

@media (max-width:640px){
  .wrap{width:calc(100% - 26px)}
  section{padding:clamp(56px,13vw,80px) 0}
  #hero{padding-top:100px;min-height:auto;padding-bottom:64px}
  .btn{padding:17px 26px}
  .phone{width:min(380px,94vw);aspect-ratio:auto;height:auto}
  .cardframe{width:min(310px,86vw)}
  .share-row{width:100%} .share-row .btn{flex:1 1 100%}
  .findme input,.findme .btn{flex:1 1 100%;min-width:0}
  .gather{gap:14px} .ringbox{width:124px;height:124px} .counter{font-size:2.1rem}
}
@media (max-width:380px){ .wrap{width:calc(100% - 20px)} .langbtn{padding:6px 8px 6px 7px} }
/* phones: one light shadow, no blur behind the header — both are expensive while scrolling */
@media (pointer:coarse){
  .page{text-shadow:0 1px 6px rgba(6,3,15,.9)}
  header,.guide .in{backdrop-filter:none;-webkit-backdrop-filter:none}
  header{background:rgba(6,3,15,.86)} header.stuck{background:rgba(6,3,15,.94)}
  .guide .in{background:rgba(14,7,34,.96)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto} .js-rv .rv{opacity:1;transform:none}
  .stage .scene-t,.stage .scene-b,.stage .scene-c{opacity:1;transform:none}
}

<script>(function(){ var b = document.getElementById('boot'), done = false; window.__bootLift = function(){ if (done) return; done = true; b.classList.add('gone'); setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 700); };
  setTimeout(function(){ if (!done) document.getElementById('bootSlow').hidden = false; }, 8000); setTimeout(window.__bootLift, 15000); })();</script>
